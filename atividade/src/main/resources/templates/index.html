<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Tarefas</title>
<!-- Materialize CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>

	<div class="container" style="margin-top: 30px;">
		<h4 class="blue-text text-darken-2">Lista de Tarefas</h4>

		<!-- Formulário para adicionar tarefa -->
		<div class="card-panel">
			<form th:action="@{/salvar}" th:object="${tarefa}" method="post">
				<div class="input-field">
					<input id="descricao" type="text" th:field="*{descricao}" required>
					<label for="descricao">Nova Tarefa</label>
				</div>
				<button class="btn waves-effect waves-light blue" type="submit">Adicionar</button>
			</form>
		</div>

		<!-- Tabela com a listagem das tarefas -->
		<div class="card-panel">
			<table class="striped">
				<thead>
					<tr>
						<th>ID</th>
						<th>Descrição</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="t : ${tarefas}">
						<td th:text="${t.id}">1</td>
						<td th:text="${t.descricao}">Exemplo de Tarefa</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- Materialize JavaScript -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
